[project]
name = "review-sense-experiments"
version = "0.1.0"
description = "ML experiments for ReviewSense rating prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_sense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
